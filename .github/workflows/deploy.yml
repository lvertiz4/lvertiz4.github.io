name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by configure-pages / deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2

      # Prebuilt binary via cargo-binstall: seconds instead of a ~5 minute compile.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.26.1

      - name: Install cargo-leptos
        run: cargo binstall -y --locked cargo-leptos@0.3.11

      # Compiles the wasm bundle + CSS + assets into dist/, and the ssr binary into target/release/.
      - name: Build site assets
        run: cargo leptos build --release

      # Pre-renders every static route to dist/**/index.html.
      - name: Generate static pages
        run: ./target/release/portfolio generate

      - name: Check expected pages exist
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          ls dist/projects/*/index.html
          test -f dist/pkg/portfolio.wasm

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
